<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF-MERGER</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="topbar">
        <a href="../index.html" class="logo">PDF<span>Tools</span></a>
        <div id="time">00:00:00</div>
    </header>
    <main class="body">
        <section class="page-title">
            <p class="tag">PDF Tool</p>
            <h1>Merge PDFs</h1>
            <p class="sub">
                Combine multiple PDF files into a single document.
            </p>
        </section>
        <section class="app">
            <label class="upload">
                <input type="file" id="files" accept=".pdf" multiple>
                <h3>Click here</h3>
                <p>To select PDFs</p>
            </label>
            <div id="fileList"></div>
            <button id="mergeBtn" class="btn" disabled>
                Merge PDFs
            </button>
            <p id="status" class="status"></p>
        </section>
    </main>
    <footer>
        PDF Merger - PDF Tools
    </footer>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
